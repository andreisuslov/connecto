name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: connecto-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: connecto-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            asset_name: connecto-x86_64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: connecto-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Verify and stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a tag build; skipping version guard and stamping."
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag v$VERSION does not match Cargo.toml workspace version $CARGO_VERSION. Bump the workspace version before tagging."
            exit 1
          fi
          # Build-time stamping of the remaining version sources.
          sed -i.bak -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" connecto_gui/package.json
          sed -i.bak -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" connecto_gui/tauri.conf.json
          sed -i.bak -E "s|<version>[^<]*</version>|<version>$VERSION</version>|" packaging/chocolatey/connecto.nuspec
          rm -f connecto_gui/package.json.bak connecto_gui/tauri.conf.json.bak packaging/chocolatey/connecto.nuspec.bak
          echo "Stamped version $VERSION into package.json, tauri.conf.json, and connecto.nuspec."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package connecto_cli

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.${{ matrix.archive }} connecto
          cd ../../..
          shasum -a 256 ${{ matrix.asset_name }}.${{ matrix.archive }} > ${{ matrix.asset_name }}.${{ matrix.archive }}.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path connecto.exe -DestinationPath ../../../${{ matrix.asset_name }}.${{ matrix.archive }}
          cd ../../..
          $hash = (Get-FileHash "${{ matrix.asset_name }}.${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.${{ matrix.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.${{ matrix.archive }}
            ${{ matrix.asset_name }}.${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
