name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: connecto-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: connecto-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            asset_name: connecto-x86_64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: connecto-windows-x86_64
            # Statically link the MSVC C runtime.
            #
            # connecto's job is bootstrapping SSH access onto machines that were
            # just provisioned, but a dynamically linked build imports
            # VCRUNTIME140.dll from the Visual C++ Redistributable, which fresh
            # Windows images (Server 2025 among them) do not ship. The failure
            # mode is hostile: the process cannot start, so it prints nothing at
            # all and only sets exit code 0xC0000135 (STATUS_DLL_NOT_FOUND) -
            # indistinguishable from a command that silently did nothing.
            #
            # Safe here because this job passes --target explicitly, so the flag
            # applies to the target only and not to host build scripts or
            # proc-macro crates. Do not move this into .cargo/config.toml: CI
            # builds without --target, where it would hit host units too.
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4

      - name: Verify and stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a tag build; skipping version guard and stamping."
            exit 0
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag v$VERSION does not match Cargo.toml workspace version $CARGO_VERSION. Bump the workspace version before tagging."
            exit 1
          fi
          # Build-time stamping of the remaining version sources.
          sed -i.bak -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" connecto_gui/package.json
          # Root "version" (line 3) and packages."".version (line 9) only;
          # dependency entries further down must not be touched.
          sed -i.bak -E "1,10s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" connecto_gui/package-lock.json
          sed -i.bak -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" connecto_gui/tauri.conf.json
          sed -i.bak -E "s|<version>[^<]*</version>|<version>$VERSION</version>|" packaging/chocolatey/connecto.nuspec
          rm -f connecto_gui/package.json.bak connecto_gui/package-lock.json.bak connecto_gui/tauri.conf.json.bak packaging/chocolatey/connecto.nuspec.bak
          echo "Stamped version $VERSION into package.json, package-lock.json, tauri.conf.json, and connecto.nuspec."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # Empty for every target that does not set it, which cargo treats as no flags.
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} --package connecto_cli

      - name: Verify Windows binary is self-contained
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Guards a regression that is invisible on any dev machine: a dynamically
          # linked build only fails on a host lacking the VC++ Redistributable, and
          # it fails silently there (0xC0000135, no output). Reads the PE import
          # table directly rather than shelling out to dumpbin, which is not
          # reliably on PATH on hosted runners.
          $exe = "target/${{ matrix.target }}/release/connecto.exe"
          $b = [IO.File]::ReadAllBytes($exe)
          $e = [BitConverter]::ToInt32($b, 0x3C)
          if ([BitConverter]::ToUInt32($b, $e) -ne 0x00004550) { throw "not a PE file: $exe" }
          $nsec  = [BitConverter]::ToUInt16($b, $e + 6)
          $optsz = [BitConverter]::ToUInt16($b, $e + 20)
          $opt   = $e + 24
          $magic = [BitConverter]::ToUInt16($b, $opt)
          $ddoff = $opt + $(if ($magic -eq 0x20b) { 112 } else { 96 })
          $impRva = [BitConverter]::ToUInt32($b, $ddoff + 8)
          $secTab = $e + 24 + $optsz
          $secs = @()
          for ($i = 0; $i -lt $nsec; $i++) {
            $o = $secTab + $i * 40
            $secs += [pscustomobject]@{
              Va  = [BitConverter]::ToUInt32($b, $o + 12)
              Vsz = [BitConverter]::ToUInt32($b, $o + 8)
              Ptr = [BitConverter]::ToUInt32($b, $o + 20)
              Rsz = [BitConverter]::ToUInt32($b, $o + 16)
            }
          }
          function Rva2Off([uint32]$r) {
            foreach ($s in $secs) {
              $span = [Math]::Max($s.Vsz, $s.Rsz)
              if ($r -ge $s.Va -and $r -lt ($s.Va + $span)) { return $s.Ptr + ($r - $s.Va) }
            }
            return $null
          }
          $off = Rva2Off $impRva
          $dlls = @()
          for ($i = 0; ; $i++) {
            $ent = $off + $i * 20
            $chunk = 0..4 | ForEach-Object { [BitConverter]::ToUInt32($b, $ent + $_ * 4) }
            if (($chunk | Where-Object { $_ -ne 0 }).Count -eq 0) { break }
            $no = Rva2Off ([BitConverter]::ToUInt32($b, $ent + 12))
            if ($null -eq $no) { break }
            $end = $no; while ($b[$end] -ne 0) { $end++ }
            $dlls += [Text.Encoding]::ASCII.GetString($b, $no, $end - $no)
          }
          Write-Host "Imported DLLs:"
          $dlls | Sort-Object | ForEach-Object { Write-Host "  $_" }
          if (($dlls -join "`n") -match 'VCRUNTIME\d+\.dll') {
            Write-Error "connecto.exe still imports the VC++ runtime; the static CRT link did not take effect."
            exit 1
          }
          Write-Host "OK: no VCRUNTIME import - binary does not need the VC++ Redistributable."

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.${{ matrix.archive }} connecto
          cd ../../..
          shasum -a 256 ${{ matrix.asset_name }}.${{ matrix.archive }} > ${{ matrix.asset_name }}.${{ matrix.archive }}.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path connecto.exe -DestinationPath ../../../${{ matrix.asset_name }}.${{ matrix.archive }}
          cd ../../..
          $hash = (Get-FileHash "${{ matrix.asset_name }}.${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.${{ matrix.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.${{ matrix.archive }}
            ${{ matrix.asset_name }}.${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
