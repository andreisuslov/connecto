name: GUI

on:
  push:
    branches: [main]
    paths:
      - 'connecto_gui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'connecto_gui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  gui:
    name: GUI build and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: connecto_gui/package-lock.json

      - name: Build frontend
        working-directory: connecto_gui
        run: |
          npm ci
          npm run build

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy -p connecto_gui -- -D warnings

      - name: Run tests
        run: cargo test -p connecto_gui
