name: GUI

on:
  push:
    branches: [main]
    paths:
      - 'connecto_gui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'connecto_gui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/gui.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  gui:
    name: GUI build and lint
    # Built on macOS: the Tauri shell targets the system WebView (WKWebView
    # on macOS), so there are no webkit2gtk system-library version pitfalls,
    # and macOS is the GUI's primary platform. The pure-Rust core/CLI are
    # exercised on the full 3-OS matrix in ci.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: connecto_gui/package-lock.json

      - name: Build frontend
        working-directory: connecto_gui
        run: |
          npm ci
          npm run build

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy -p connecto_gui -- -D warnings

      - name: Run tests
        run: cargo test -p connecto_gui
