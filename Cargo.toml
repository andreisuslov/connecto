[workspace]
resolver = "2"
members = [
    "connecto_core",
    "connecto_cli",
    "connecto_gui",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
authors = ["Connecto Team"]
description = "AirDrop-like SSH pairing application"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# mDNS discovery
mdns-sd = "0.11"

# SSH key management
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "std"] }
rand = "0.8"

# Networking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hostname = "0.4"
local-ip-address = "0.6"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI specific
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
colored = "2.1"
dialoguer = "0.11"
indicatif = "0.17"
directories = "5.0"
libc = "0.2"

# Bluetooth Low Energy
btleplug = "0.11"
bluer = { version = "0.17", features = ["bluetoothd"] }
uuid = { version = "1.0", features = ["v4"] }

# Testing
tempfile = "3.10"
